name: Tests

on:
  push:
    branches:
      - main
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: k_agent
          POSTGRES_USER: k_agent_user
          POSTGRES_PASSWORD: Agent@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U k_agent_user -d k_agent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check PHP style
        run: vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Create testing schema
        env:
          PGPASSWORD: Agent@123
        run: psql -h 127.0.0.1 -U k_agent_user -d k_agent -c "CREATE SCHEMA IF NOT EXISTS testing;"

      - name: Execute tests
        run: |
          php artisan config:clear --ansi
          php artisan test
